<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血染鐘樓：覆盤／紀錄／排行榜by 廚爹</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <style>
        @media (max-width: 900px) {
            .record-layout-wrapper { flex-direction: column !important; gap: 1rem !important; }
            .record-sidebar, .record-main { width: 100% !important; max-width: 100% !important; min-width: 0 !important; }
            .record-sidebar { height: auto !important; overflow: visible !important; }
            .sidebar-card { max-height: none !important; }
            .form-grid-3 { grid-template-columns: 1fr !important; }
            .submit-footer-sidebar { position: static !important; }
        }
        @media (max-width: 640px) {
            .main-content { padding-left: 1rem !important; padding-right: 1rem !important; overflow-x: hidden !important; }
            .record-layout-wrapper, .record-main, .record-sidebar, #record-form, .card { min-width: 0 !important; }
            .player-row { display: grid !important; grid-template-columns: 42px minmax(0, 1fr) !important; gap: .55rem !important; align-items: start !important; }
            .player-row > div { grid-column: 1 / -1 !important; width: 100% !important; min-width: 0 !important; }
            .player-row > div:first-child { grid-column: 1 !important; align-self: center !important; }
            .player-row > div:last-child { grid-column: 2 !important; text-align: right !important; }
            .player-row input, .player-row select { width: 100% !important; min-width: 0 !important; }
            .side-match-flex { align-items: flex-start !important; flex-wrap: wrap !important; }
            .side-mini-box { width: calc(50% - .35rem) !important; }
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/roles_db.js"></script>
    <script>
        let origin = window.location.origin;
        if (origin.endsWith('/')) origin = origin.slice(0, -1);
        window.API_BASE = origin;
        console.log("🚀 系統啟動，角色數據庫狀態:", window.MASTER_ROLE_DB ? "✅ 已載入" : "❌ 未載入");
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div class="background-effects">
        <div class="glow red-glow"></div>
        <div class="glow purple-glow"></div>
    </div>

    <nav class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-clock"></i>
            <h1>拉普拉斯 <span class="accent">血染名人堂</span></h1>
        </div>
        <button class="hamburger-btn" id="mobile-menu-btn">
            <span class="menu-hint">選單切換</span>
            <i class="fa-solid fa-bars"></i>
        </button>
    </nav>

    <ul class="nav-links" id="main-nav">
        <li class="active"><a href="#" data-page="dashboard"><i class="fa-solid fa-chart-line"></i> <span>數據看板</span></a></li>
        <li><a href="#" data-page="knowledge"><i class="fa-solid fa-book-atlas"></i> <span>角色與規則</span></a></li>
        <li><a href="#" data-page="scripts"><i class="fa-solid fa-scroll"></i> <span>劇本瀏覽</span></a></li>
        <li><a href="#" data-page="rooms"><i class="fa-solid fa-door-open"></i> <span>小鎮報到</span></a></li>
        <li><a href="#" data-page="recorder"><i class="fa-solid fa-book-open"></i> <span>覆盤紀錄器</span></a></li>
        <li><a href="#" data-page="record"><i class="fa-solid fa-feather-pointed"></i> <span>錄入對局</span></a></li>
        <li><a href="#" data-page="history"><i class="fa-solid fa-clock-rotate-left"></i> <span>歷史紀錄＆戰績查詢</span></a></li>
        <li id="admin-role-nav-item" style="display:none;"><a href="#" data-page="role_admin"><i class="fa-solid fa-address-book"></i> <span>角色資料庫</span></a></li>
        <li id="admin-bindings-nav-item" style="display:none;"><a href="#" data-page="account_bindings"><i class="fa-solid fa-link"></i> <span>帳號綁定</span></a></li>
        <li id="admin-nav-item" style="display:none;"><a href="#" data-page="admin"><i class="fa-solid fa-shield-halved"></i> <span>管理後台</span></a></li>
        <li id="site-account-nav-item" class="nav-account-item" aria-live="polite">
            <span class="nav-account-loading"><i class="fa-solid fa-user-clock"></i> 帳號載入中</span>
        </li>
    </ul>

    <main class="main-content" id="content-area">
        <div class="loading">正在召喚魔典...</div>
    </main>

    <script>
        async function loadPage(pageName) {
            const area = document.getElementById('content-area');
            if (!area) return;
            area.style.opacity = '0.5';
            try {
                const response = await fetch(`/pages/${pageName}.html?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error("頁面載入失敗");
                const html = await response.text();
                area.innerHTML = html;

                const scripts = Array.from(area.querySelectorAll('script'));
                for (const oldScript of scripts) {
                    const type = oldScript.getAttribute('type');
                    const src = oldScript.getAttribute('src');
                    oldScript.remove();

                    if (type === 'text/babel') {
                        let sourceCode = '';
                        if (src) {
                            const scriptUrl = `${src}?v=${new Date().getTime()}`;
                            const scriptResp = await fetch(scriptUrl);
                            if (!scriptResp.ok) throw new Error(`腳本載入失敗：${src}`);
                            sourceCode = await scriptResp.text();
                        } else {
                            sourceCode = oldScript.textContent || '';
                        }
                        const transformed = Babel.transform(sourceCode, {
                            presets: [['react', { runtime: 'classic' }]],
                            sourceType: 'script'
                        }).code;
                        const newScript = document.createElement('script');
                        newScript.textContent = transformed;
                        document.body.appendChild(newScript);
                        continue;
                    }

                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => {
                        if (attr.name !== 'type' && attr.name !== 'src') newScript.setAttribute(attr.name, attr.value);
                    });
                    if (src) {
                        if (oldScript.hasAttribute('data-page-scope')) {
                            const sourceCache = window.__pageScriptSourceCache || (window.__pageScriptSourceCache = new Map());
                            let sourceCode = sourceCache.get(src);
                            if (!sourceCode) {
                                const scriptUrl = `${src}${src.includes('?') ? '&' : '?'}v=${new Date().getTime()}`;
                                const scriptResp = await fetch(scriptUrl);
                                if (!scriptResp.ok) throw new Error(`腳本載入失敗：${src}`);
                                sourceCode = await scriptResp.text();
                                sourceCache.set(src, sourceCode);
                            }
                            newScript.textContent = `(() => {\n${sourceCode}\n})();\n//# sourceURL=${src}`;
                            document.body.appendChild(newScript);
                            continue;
                        }
                        newScript.async = false;
                        newScript.src = `${src}${src.includes('?') ? '&' : '?'}v=${new Date().getTime()}`;
                        await new Promise((resolve, reject) => {
                            newScript.addEventListener('load', resolve, { once: true });
                            newScript.addEventListener('error', () => reject(new Error(`腳本載入失敗：${src}`)), { once: true });
                            document.body.appendChild(newScript);
                        });
                    } else {
                        newScript.textContent = oldScript.textContent || '';
                        document.body.appendChild(newScript);
                    }
                }

                area.style.opacity = '1';
                document.querySelectorAll('#main-nav li').forEach(li => {
                    const link = li.querySelector('a');
                    if (link.getAttribute('data-page') === pageName) li.classList.add('active');
                    else li.classList.remove('active');
                });
            } catch (err) {
                area.innerHTML = `<div class="card"><h3>無法載入頁面</h3><p>${err.message}</p></div>`;
                area.style.opacity = '1';
            }
        }

        async function revealAdminNav() {
            const adminItem = document.getElementById('admin-nav-item');
            const bindingItem = document.getElementById('admin-bindings-nav-item');
            const roleItem = document.getElementById('admin-role-nav-item');
            try {
                const resp = await fetch(`${window.API_BASE || ''}/api/me`, { credentials: 'same-origin' });
                if (!resp.ok) return;
                const me = await resp.json();
                const showAdmin = !!me.is_admin;
                if (adminItem) adminItem.style.display = showAdmin ? 'flex' : 'none';
                if (bindingItem) bindingItem.style.display = showAdmin ? 'flex' : 'none';
                if (roleItem) roleItem.style.display = showAdmin ? 'flex' : 'none';
            } catch (err) {}
        }

        function authNextUrl() {
            return `${window.location.pathname}${window.location.search}${window.location.hash}`;
        }

        function renderSiteAccount(me) {
            const item = document.getElementById('site-account-nav-item');
            if (!item) return;
            item.replaceChildren();

            if (!me?.logged_in || !me.user) {
                const login = document.createElement('a');
                login.className = 'nav-account-login';
                login.href = `/api/auth/line/login?next=${encodeURIComponent(authNextUrl())}`;
                login.innerHTML = '<i class="fa-brands fa-line"></i><span>LINE 登入</span>';
                item.appendChild(login);
                return;
            }

            const identity = document.createElement('span');
            identity.className = 'nav-account-identity';
            identity.title = me.user.display_name || 'LINE 使用者';
            identity.innerHTML = '<i class="fa-brands fa-line"></i>';
            const name = document.createElement('span');
            name.className = 'nav-account-name';
            name.textContent = me.user.display_name || 'LINE 使用者';
            identity.appendChild(name);

            const logout = document.createElement('button');
            logout.type = 'button';
            logout.className = 'nav-account-logout';
            logout.innerHTML = '<i class="fa-solid fa-right-from-bracket"></i><span>登出</span>';
            logout.addEventListener('click', async () => {
                logout.disabled = true;
                logout.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>登出中</span>';
                try {
                    const response = await fetch('/api/auth/logout', {
                        method: 'POST',
                        credentials: 'same-origin'
                    });
                    if (!response.ok) throw new Error('登出失敗');
                    window.location.reload();
                } catch (err) {
                    logout.disabled = false;
                    logout.innerHTML = '<i class="fa-solid fa-right-from-bracket"></i><span>重試登出</span>';
                    logout.title = err.message || '登出失敗';
                }
            });
            item.append(identity, logout);
        }

        async function refreshSiteAccount() {
            try {
                const response = await fetch(`${window.API_BASE || ''}/api/me`, {
                    credentials: 'same-origin',
                    cache: 'no-store'
                });
                if (!response.ok) throw new Error('無法取得登入狀態');
                renderSiteAccount(await response.json());
            } catch (err) {
                const item = document.getElementById('site-account-nav-item');
                if (item) {
                    item.innerHTML = '<button type="button" class="nav-account-retry"><i class="fa-solid fa-rotate-right"></i><span>重試帳號狀態</span></button>';
                    item.querySelector('button')?.addEventListener('click', refreshSiteAccount);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            let loadedPage = '';
            const pageFromHash = () => {
                const rawHash = window.location.hash.replace('#', '');
                if (rawHash.startsWith('knowledge/')) return 'knowledge';
                if (rawHash.startsWith('scripts/')) return 'scripts';
                return rawHash || 'dashboard';
            };
            const loadPageFromHash = () => {
                const page = pageFromHash();
                if (page !== loadedPage) {
                    loadedPage = page;
                    loadPage(page);
                }
            };
            document.querySelectorAll('#main-nav a').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const page = e.currentTarget.getAttribute('data-page');
                    if (window.location.hash === `#${page}`) {
                        loadedPage = page;
                        loadPage(page);
                    } else {
                        window.location.hash = page;
                    }
                    const navMenu = document.getElementById('main-nav');
                    if (navMenu.classList.contains('active')) navMenu.classList.remove('active');
                });
            });
            const menuBtn = document.getElementById('mobile-menu-btn');
            const navMenu = document.getElementById('main-nav');
            if (menuBtn && navMenu) {
                menuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    navMenu.classList.toggle('active');
                });
            }
            document.addEventListener('click', (e) => {
                if (navMenu && navMenu.classList.contains('active') && !navMenu.contains(e.target)) navMenu.classList.remove('active');
            });
            window.addEventListener('hashchange', loadPageFromHash);
            revealAdminNav();
            refreshSiteAccount();
            loadPageFromHash();
        });
    </script>
</body>
</html>
