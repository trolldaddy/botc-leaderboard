<header class="top-header knowledge-header">
  <div>
    <div class="knowledge-kicker">拉普拉斯推理資料庫</div>
    <h2>角色與規則查詢</h2>
    <p>從玩家、百科與說書人視角，閱讀角色資料、規則與拉普拉斯補充內容。</p>
  </div>
</header>

<section class="card knowledge-search-card">
  <form id="knowledge-search-form" class="knowledge-search-form">
    <div class="knowledge-search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="knowledge-search-input" class="form-control dark-input" autocomplete="off" placeholder="搜尋角色、英文名、簡中名稱或別名，例如：酒鬼">
    </div>
    <select id="knowledge-type-filter" class="form-control dark-input" aria-label="內容類型">
      <option value="">全部類型</option>
    </select>
    <button class="btn btn-purple" type="submit">搜尋</button>
  </form>
  <div id="knowledge-search-meta" class="knowledge-search-meta">正在載入知識索引...</div>
</section>

<div class="knowledge-layout">
  <section class="card knowledge-results-card">
    <div class="card-header"><h3><i class="fa-solid fa-list"></i> 搜尋結果</h3></div>
    <div id="knowledge-results" class="knowledge-results"><div class="knowledge-empty">正在整理條目...</div></div>
  </section>

  <section class="card knowledge-detail-card">
    <div id="knowledge-detail" class="knowledge-detail-empty">
      <i class="fa-solid fa-book-open"></i>
      <h3>選擇一個條目</h3>
      <p>先從左側搜尋結果選擇角色或規則條目。</p>
    </div>
  </section>
</div>

<style>
  .knowledge-header{margin-bottom:1rem}
  .knowledge-kicker{font-size:.72rem;letter-spacing:.18em;color:var(--accent-gold);font-weight:900}
  .knowledge-header h2{font-family:'Cinzel',serif;letter-spacing:.08em;margin:.3rem 0}
  .knowledge-header p{color:var(--text-muted);margin:0;line-height:1.6}
  .knowledge-search-card{margin-bottom:1.25rem}
  .knowledge-search-form{display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:.75rem;align-items:center}
  .knowledge-search-box{position:relative}
  .knowledge-search-box i{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-muted)}
  .knowledge-search-box input{padding-left:2.8rem!important}
  .knowledge-search-meta{margin-top:.75rem;color:var(--text-muted);font-size:.85rem}
  .knowledge-layout{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:1.25rem;align-items:start}
  .knowledge-results{display:flex;flex-direction:column;gap:.55rem;max-height:calc(100vh - 300px);overflow:auto;padding-right:.25rem}
  .knowledge-result{width:100%;text-align:left;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);color:inherit;border-radius:10px;padding:.8rem;cursor:pointer}
  .knowledge-result:hover,.knowledge-result.is-active{border-color:rgba(255,183,3,.4);background:rgba(255,255,255,.065)}
  .knowledge-result-title{font-weight:900;color:#fff}
  .knowledge-result-meta{font-size:.74rem;color:var(--text-muted);margin-top:.25rem}
  .knowledge-type-chip{display:inline-flex;padding:.16rem .45rem;border-radius:999px;background:rgba(124,58,237,.18);color:#d9ccff;font-size:.68rem;margin-right:.4rem}
  .knowledge-empty,.knowledge-detail-empty{text-align:center;color:var(--text-muted);padding:2.5rem 1rem}
  .knowledge-detail-empty i{font-size:2rem;color:var(--accent-gold);margin-bottom:.8rem}
  .knowledge-detail-title{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:1rem}
  .knowledge-detail-title h2{margin:0;color:#fff;font-size:1.55rem}
  .knowledge-name-en{color:var(--text-muted);margin-top:.3rem}
  .knowledge-section{margin-top:1.25rem}
  .knowledge-section>h3{font-size:.82rem;color:var(--accent-gold);letter-spacing:.08em;margin-bottom:.65rem}
  .knowledge-block-list{display:grid;gap:.85rem}
  .knowledge-block{border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.03);overflow:hidden}
  .knowledge-block-structured{padding:1rem 1.05rem}
  .knowledge-block-heading{display:flex;gap:.8rem;align-items:flex-start;padding-bottom:.75rem;margin-bottom:.8rem;border-bottom:1px solid rgba(255,255,255,.07)}
  .knowledge-block-heading>i{width:1.4rem;color:var(--accent-gold);font-size:1rem;margin-top:.15rem;text-align:center}
  .knowledge-block-heading strong{display:block;color:#fff;font-size:1rem}
  .knowledge-block-heading span{display:block;color:var(--text-muted);font-size:.7rem;margin-top:.2rem}
  .knowledge-block-body{display:block;color:var(--text-main);font-size:.92rem;line-height:1.82}
  .knowledge-block-body p{margin:0 0 .85rem}
  .knowledge-block-body p:last-child{margin-bottom:0}
  .knowledge-block-body h4{margin:1.15rem 0 .55rem;color:#fff;font-size:.95rem;border-left:3px solid var(--accent-gold);padding-left:.65rem}
  .knowledge-block-body ul,.knowledge-block-body ol{margin:.35rem 0 1rem;padding-left:1.35rem;display:grid;gap:.48rem}
  .knowledge-block-body li{padding-left:.18rem}
  .knowledge-block-body li::marker{color:var(--accent-gold)}
  .knowledge-block-body blockquote{margin:.7rem 0 1rem;padding:.75rem 1rem;border-left:3px solid rgba(255,183,3,.6);background:rgba(255,183,3,.06);color:#e6dcc1;border-radius:0 8px 8px 0}
  .knowledge-block-body strong{color:#fff}
  .knowledge-block-body .rich-size-sm{font-size:.82em}.knowledge-block-body .rich-size-md{font-size:1em}.knowledge-block-body .rich-size-lg{font-size:1.18em;line-height:1.55}.knowledge-block-body .rich-size-xl{display:inline-block;font-size:1.38em;line-height:1.4;font-weight:800;color:#fff;margin:.2em 0}
  .knowledge-table-wrap{overflow-x:auto;margin:.75rem 0 1rem;border:1px solid rgba(255,255,255,.08);border-radius:10px}
  .knowledge-table{width:100%;border-collapse:collapse;min-width:520px}

  .knowledge-table th{color:var(--accent-gold);font-size:.78rem;background:rgba(255,255,255,.035)}
  .knowledge-table tr:last-child td{border-bottom:0}
  .knowledge-block-source{background:rgba(0,0,0,.16)}
  .knowledge-source-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 1rem;border:0;background:transparent;color:var(--text-muted);cursor:pointer;text-align:left}
  .knowledge-source-toggle span:first-child{display:flex;align-items:center;gap:.55rem;color:#ddd}
  .knowledge-source-toggle span:last-child{color:var(--accent-gold);font-size:.76rem}
  .knowledge-source-note{padding:0 1rem .9rem;color:var(--text-muted);font-size:.8rem;line-height:1.6}
  .knowledge-block-source .knowledge-block-body{padding:0 1rem 1rem}
  .knowledge-source-reference{padding-top:.25rem}
  .knowledge-source-link{display:inline-flex;gap:.45rem;align-items:center;color:var(--accent-gold);text-decoration:none}
  .knowledge-warning{padding:.75rem 1rem;border-radius:9px;background:rgba(255,183,3,.08);border:1px solid rgba(255,183,3,.2);color:#e7d6a0;font-size:.82rem;line-height:1.6}
  .knowledge-aliases,.knowledge-relations{display:flex;flex-wrap:wrap;gap:.5rem}
  .knowledge-alias,.knowledge-relation{padding:.4rem .65rem;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:.82rem}

  .knowledge-relation small{color:var(--text-muted);margin-left:.25rem}
  .knowledge-relation:hover{border-color:rgba(255,183,3,.35)}
  .knowledge-relation-groups{display:grid;gap:1rem}
  .knowledge-relation-group{padding:.9rem;border-radius:10px;background:rgba(0,0,0,.14);border:1px solid rgba(255,255,255,.06)}
  .knowledge-relation-group-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.7rem}
  .knowledge-relation-group-head h4{margin:0;color:#fff;font-size:.86rem}
  .knowledge-relation-group-head h4 span{display:inline-flex;min-width:1.6rem;justify-content:center;margin-left:.3rem;padding:.1rem .35rem;border-radius:999px;background:rgba(255,255,255,.08);color:var(--text-muted);font-size:.7rem}
  .knowledge-relation-toggle{border:0;background:transparent;color:var(--accent-gold);cursor:pointer;font-size:.76rem;padding:.2rem}
  .knowledge-relation-toggle:hover{text-decoration:underline}
  @media(max-width:900px){.knowledge-search-form,.knowledge-layout{grid-template-columns:1fr}.knowledge-results{max-height:none}.knowledge-detail-card{min-height:320px}}
  @media(max-width:640px){.knowledge-search-form .btn{width:100%}.knowledge-detail-title{flex-direction:column}.knowledge-relation-group-head{align-items:flex-start}.knowledge-relations{gap:.4rem}.knowledge-relation{font-size:.78rem}.knowledge-block-body{font-size:.9rem;line-height:1.75}.knowledge-source-toggle{align-items:flex-start}.knowledge-table{min-width:460px}}
</style>
