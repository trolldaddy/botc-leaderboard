name: Seed Reviewed Bilibili Scripts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview validates all 26 scripts; write updates the database only after a complete preview
        required: true
        default: preview
        type: choice
        options: [preview, write]

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/town-checkin
      - name: Connect to Cloud SQL
        uses: ./.github/actions/setup-cloud-sql
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate database configuration
        run: test -n "$DATABASE_URL"
      - name: Import reviewed scripts
        run: |
          args=(--require-complete --report reports/bilibili-script-audit.json)
          if [ "${{ inputs.mode }}" = "write" ]; then args+=(--write); fi
          python scripts/import_bilibili_scripts.py "${args[@]}"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-script-audit-${{ inputs.mode }}
          path: reports/bilibili-script-audit.json
          if-no-files-found: warn
