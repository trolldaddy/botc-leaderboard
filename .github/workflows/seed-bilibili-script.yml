name: Seed Bilibili Script

on:
  workflow_dispatch:
    inputs:
      script:
        description: Reviewed script to import
        required: true
        default: wafuleiming
        type: choice
        options:
          - wafuleiming
          - gongshengti
      mode:
        description: Preview validates matching; write updates the database
        required: true
        default: preview
        type: choice
        options: [preview, write]

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/town-checkin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate database configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: test -n "$DATABASE_URL"
      - name: Import reviewed script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          case "${{ inputs.script }}" in
            wafuleiming)
              metadata=data/scripts/wafuleiming.json
              script_json=data/scripts/wafuleiming-script.json
              ;;
            gongshengti)
              metadata=data/scripts/gongshengti.json
              script_json=data/scripts/gongshengti-script.json
              ;;
            *) echo "Unsupported script: ${{ inputs.script }}"; exit 1 ;;
          esac
          args=()
          if [ "${{ inputs.mode }}" = "write" ]; then args+=(--write); fi
          python scripts/import_bilibili_script.py \
            "$metadata" \
            "$script_json" \
            "${args[@]}"
