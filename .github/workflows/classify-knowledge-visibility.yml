name: Classify Knowledge Visibility

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview or write Knowledge public/internal visibility"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - write

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/town-checkin

      - name: Connect to Cloud SQL
        uses: ./.github/actions/setup-cloud-sql
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Classify Knowledge visibility
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "write" ]; then
            python scripts/classify_knowledge_visibility.py --write
          else
            python scripts/classify_knowledge_visibility.py
          fi
