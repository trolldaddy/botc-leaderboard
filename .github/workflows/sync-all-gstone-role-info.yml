name: Sync All GStone Role Info

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview or write structured role information and official abilities"
        required: true
        default: "preview"
        type: choice
        options: [preview, write]
      delay:
        description: "Delay between GStone requests in seconds"
        required: false
        default: "0.15"
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/town-checkin
      - name: Connect to Cloud SQL
        uses: ./.github/actions/setup-cloud-sql
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Sync all GStone role information and official abilities
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "write" ]; then
            python scripts/sync_all_gstone_role_info.py --write --delay "${{ inputs.delay }}"
          else
            python scripts/sync_all_gstone_role_info.py --delay "${{ inputs.delay }}"
          fi
