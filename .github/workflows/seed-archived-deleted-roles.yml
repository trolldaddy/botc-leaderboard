name: Seed Archived Deleted Roles

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Explicitly preview or write archived community role data (non-GStone)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - write

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/town-checkin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed archived community role data (explicit opt-in)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "write" ]; then
            python scripts/seed_archived_deleted_roles.py --write
          else
            python scripts/seed_archived_deleted_roles.py
