name: GStone Wiki Crawl

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: Maximum number of pages to fetch
        required: true
        default: "5000"
      delay:
        description: Delay between requests in seconds
        required: true
        default: "0.7"
      parse_reminders_all:
        description: Run reminder parser on every page
        required: true
        type: boolean
        default: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl wiki
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [[ "${{ inputs.parse_reminders_all }}" == "true" ]]; then
            EXTRA_ARGS+=(--parse-reminders-all)
          fi
          python3 scripts/crawl_gstone_wiki.py \
            --max-pages "${{ inputs.max_pages }}" \
            --delay "${{ inputs.delay }}" \
            --output reports/gstone-crawl.json \
            "${EXTRA_ARGS[@]}" \
            | tee reports/gstone-crawl-summary.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: gstone-wiki-crawl-report
          path: |
            reports/gstone-crawl.json
            reports/gstone-crawl-summary.txt
          retention-days: 30
