name: Finish Google Cloud Cutover

on:
  push:
    branches: [feature/town-checkin]
    paths: [.github/cutover-trigger]

permissions:
  contents: read
  id-token: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      REGION: asia-east1
      SQL_INSTANCE: botc-leaderboard-db
      RUN_SERVICE: botc-twitch

    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Enable and wait for Resource Manager API
        run: |
          set -euo pipefail
          gcloud services enable cloudresourcemanager.googleapis.com
          for attempt in {1..18}; do
            if gcloud projects get-iam-policy '${{ secrets.GCP_PROJECT_ID }}' >/dev/null 2>&1; then exit 0; fi
            sleep 10
          done
          echo "Cloud Resource Manager API did not become ready" >&2
          exit 1

      - name: Grant least runtime access
        id: runtime
        run: |
          set -euo pipefail
          PROJECT_ID='${{ secrets.GCP_PROJECT_ID }}'
          SERVICE_ACCOUNT="$(gcloud run services describe "$RUN_SERVICE" --region="$REGION" --format='value(spec.template.spec.serviceAccountName)')"
          if [ -z "$SERVICE_ACCOUNT" ]; then
            PROJECT_NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
            SERVICE_ACCOUNT="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          fi
          gcloud projects add-iam-policy-binding "$PROJECT_ID" --member="serviceAccount:$SERVICE_ACCOUNT" --role=roles/cloudsql.client --condition=None
          gcloud projects add-iam-policy-binding "$PROJECT_ID" --member="serviceAccount:$SERVICE_ACCOUNT" --role=roles/storage.objectUser --condition=None
          gcloud secrets add-iam-policy-binding botc-database-url --member="serviceAccount:$SERVICE_ACCOUNT" --role=roles/secretmanager.secretAccessor
          echo "connection=$(gcloud sql instances describe "$SQL_INSTANCE" --format='value(connectionName)')" >> "$GITHUB_OUTPUT"
          echo "bucket=${PROJECT_ID}-botc-assets" >> "$GITHUB_OUTPUT"

      - name: Deploy and switch Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "$RUN_SERVICE" --source . --region="$REGION" --allow-unauthenticated --add-cloudsql-instances="${{ steps.runtime.outputs.connection }}" --set-secrets=DATABASE_URL=botc-database-url:latest --set-env-vars="GCS_BUCKET=${{ steps.runtime.outputs.bucket }},RUN_SCHEMA_MIGRATIONS=0,DB_CONNECT_TIMEOUT=10" --quiet
          SERVICE_URL="$(gcloud run services describe "$RUN_SERVICE" --region="$REGION" --format='value(status.url)')"
          curl --retry 10 --retry-delay 3 --fail --silent --show-error "$SERVICE_URL/openapi.json" >/dev/null
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "$SERVICE_URL/api/scripts" >/dev/null
          echo "Google Cloud cutover completed: $SERVICE_URL"
