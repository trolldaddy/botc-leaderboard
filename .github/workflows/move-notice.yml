name: Deploy BOTC move notice
on:
  push:
    branches: [codex/botc-move-notice]
    paths: [.github/workflows/move-notice.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy notice and verify old URL
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -eu
          test "$PROJECT" = skillful-cider-460210-r7
          gcloud run deploy botc-twitch --project "$PROJECT" --region asia-east1 \
            --source move-notice --port 8080 --clear-cloudsql-instances \
            --clear-secrets --clear-env-vars --scaling auto --min 0 --quiet
          revision="$(gcloud run services describe botc-twitch --project "$PROJECT" --region asia-east1 --format='value(status.latestReadyRevisionName)')"
          test -n "$revision"
          gcloud run services update-traffic botc-twitch --project "$PROJECT" --region asia-east1 --to-revisions "$revision=100" --quiet
          curl --fail --silent --show-error --retry 4 https://botc-twitch-873087277461.asia-east1.run.app/ -o /tmp/notice.html
          grep -F 'https://botc.larplus.com/' /tmp/notice.html

