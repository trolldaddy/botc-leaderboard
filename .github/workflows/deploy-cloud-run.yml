name: Deploy Cloud Run

on:
  push:
    branches:
      - feature/town-checkin
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run from the selected feature ref"
        required: true
        default: "deploy"
        type: choice
        options: [deploy, preview-reviewed-scripts, write-reviewed-scripts]
      deploy_ref:
        description: "Branch, tag, or commit to deploy"
        required: true
        default: "feature/town-checkin"
        type: string
      service:
        description: "Cloud Run service name"
        required: true
        default: "botc-twitch"
        type: string
      region:
        description: "Cloud Run region"
        required: true
        default: "asia-east1"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run-botc-twitch
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Resolve deployment settings
        id: settings
        shell: bash
        run: |
          set -euo pipefail
          echo "deploy_ref=${{ github.event_name == 'push' && github.ref_name || inputs.deploy_ref }}" >> "$GITHUB_OUTPUT"
          echo "service=${{ github.event_name == 'push' && 'botc-twitch' || inputs.service }}" >> "$GITHUB_OUTPUT"
          echo "region=${{ github.event_name == 'push' && 'asia-east1' || inputs.region }}" >> "$GITHUB_OUTPUT"

      - name: Checkout deployment source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.settings.outputs.deploy_ref }}

      - name: Validate deployment configuration
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          test -n "$GCP_PROJECT_ID" || { echo "Missing repository secret: GCP_PROJECT_ID"; exit 1; }
          test -n "$GCP_SA_KEY" || { echo "Missing repository secret: GCP_SA_KEY"; exit 1; }
          test -f main.py || { echo "main.py was not found in deploy ref"; exit 1; }
          test -f knowledge_admin_routes.py || { echo "knowledge_admin_routes.py was not found in deploy ref"; exit 1; }
          test -f knowledge_public_routes.py || { echo "knowledge_public_routes.py was not found in deploy ref"; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Resolve Google Cloud runtime resources
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          connection="$(gcloud sql instances describe botc-leaderboard-db --project "${{ secrets.GCP_PROJECT_ID }}" --format='value(connectionName)')"
          bucket="${{ secrets.GCP_PROJECT_ID }}-botc-assets"
          test -n "$connection"
          echo "connection=$connection" >> "$GITHUB_OUTPUT"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"

      - name: Deploy source to Cloud Run
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${{ steps.settings.outputs.service }}" \
            --source . \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ steps.settings.outputs.region }}" \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances "${{ steps.runtime.outputs.connection }}" \
            --set-secrets "DATABASE_URL=botc-database-url:latest" \
            --set-env-vars "GCS_BUCKET=${{ steps.runtime.outputs.bucket }},RUN_SCHEMA_MIGRATIONS=0,DB_CONNECT_TIMEOUT=10" \
            --quiet

      - name: Set up Python for approved script seed
        if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[seed-script]') || contains(github.event.head_commit.message, '[seed-gongshengti]'))
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Seed approved reviewed script
        if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[seed-script]') || contains(github.event.head_commit.message, '[seed-gongshengti]'))
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "Missing repository secret: DATABASE_URL"; exit 1; }
          pip install -r requirements.txt
          if [[ "${{ github.event.head_commit.message }}" == *"[seed-gongshengti]"* ]]; then
            metadata=data/scripts/gongshengti.json
            script_json=data/scripts/gongshengti-script.json
          else
            metadata=data/scripts/wafuleiming.json
            script_json=data/scripts/wafuleiming-script.json
          fi
          python scripts/import_bilibili_script.py "$metadata" "$script_json" --require-complete
          python scripts/import_bilibili_script.py "$metadata" "$script_json" --write --require-complete

      - name: Verify deployed APIs
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "${{ steps.settings.outputs.service }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ steps.settings.outputs.region }}" \
            --format='value(status.url)')"
          echo "Service URL: $SERVICE_URL"
          curl --fail --silent --show-error "$SERVICE_URL/openapi.json" -o openapi.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("openapi.json").read_text(encoding="utf-8"))
          paths = data.get("paths", {})
          required = [
              "/api/admin/knowledge/summary",
              "/api/knowledge/search",
              "/api/scripts",
              "/api/rooms/{room_code}",
          ]
          missing = [path for path in required if path not in paths]
          if missing:
              raise SystemExit("Missing deployed routes: " + ", ".join(missing))
          print("Deployment verification passed.")
          PY

      - name: Upload deployment verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-run-deployment-verification
          path: openapi.json
          if-no-files-found: ignore
          retention-days: 7

  reviewed-script-import:
    if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[seed-reviewed-scripts]')) || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'preview-reviewed-scripts' || inputs.operation == 'write-reviewed-scripts'))
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout selected feature source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate database configuration
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "Missing repository secret: DATABASE_URL"; exit 1; }

      - name: Import all reviewed scripts
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          args=(--require-complete --report reports/bilibili-script-audit.json)
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.operation }}" = "write-reviewed-scripts" ]; then args+=(--write); fi
          python scripts/import_bilibili_scripts.py "${args[@]}"

      - name: Upload reviewed script audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-script-audit-${{ inputs.operation }}
          path: reports/bilibili-script-audit.json
          if-no-files-found: warn
          retention-days: 14
