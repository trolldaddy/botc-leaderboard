name: Deploy Cloud Run

on:
  push:
    branches:
      - feature/town-checkin
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Branch, tag, or commit to deploy"
        required: true
        default: "feature/town-checkin"
        type: string
      service:
        description: "Cloud Run service name"
        required: true
        default: "botc-twitch"
        type: string
      region:
        description: "Cloud Run region"
        required: true
        default: "asia-east1"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run-botc-twitch
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_ref || github.ref_name }}
      CLOUD_RUN_SERVICE: ${{ github.event_name == 'workflow_dispatch' && inputs.service || 'botc-twitch' }}
      CLOUD_RUN_REGION: ${{ github.event_name == 'workflow_dispatch' && inputs.region || 'asia-east1' }}

    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Validate deployment configuration
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          test -n "$GCP_PROJECT_ID" || { echo "Missing repository secret: GCP_PROJECT_ID"; exit 1; }
          test -n "$GCP_SA_KEY" || { echo "Missing repository secret: GCP_SA_KEY"; exit 1; }
          test -f main.py || { echo "main.py was not found in deploy ref: $DEPLOY_REF"; exit 1; }
          test -f knowledge_admin_routes.py || { echo "knowledge_admin_routes.py was not found in deploy ref: $DEPLOY_REF"; exit 1; }
          echo "Deploying ref: $DEPLOY_REF"
          echo "Cloud Run service: $CLOUD_RUN_SERVICE"
          echo "Cloud Run region: $CLOUD_RUN_REGION"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy source to Cloud Run
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source . \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$CLOUD_RUN_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --quiet

      - name: Verify deployed OpenAPI contains knowledge routes
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$CLOUD_RUN_REGION" \
            --format='value(status.url)')"
          echo "Service URL: $SERVICE_URL"
          curl --fail --silent --show-error "$SERVICE_URL/openapi.json" -o openapi.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("openapi.json").read_text(encoding="utf-8"))
          paths = data.get("paths", {})
          knowledge_paths = sorted(path for path in paths if "/knowledge" in path)
          room_paths = sorted(path for path in paths if "/api/rooms" in path)
          if not knowledge_paths:
              raise SystemExit("Deployment succeeded, but no knowledge routes were found in openapi.json")
          if not room_paths:
              raise SystemExit("Deployment succeeded, but no room routes were found in openapi.json")
          print("Knowledge routes found:")
          for path in knowledge_paths:
              print(f"- {path}")
          print("Room routes found:")
          for path in room_paths:
              print(f"- {path}")
          PY

      - name: Upload deployment verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-run-deployment-verification
          path: openapi.json
          if-no-files-found: ignore
          retention-days: 7
